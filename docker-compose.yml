services:

  laravel:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      # KAFKA_BROKERS: kafka:9092

    depends_on:
      - mysql
      # - kafka

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: laravel-assignment
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    depends_on:
      - mysql

  # kafka:
